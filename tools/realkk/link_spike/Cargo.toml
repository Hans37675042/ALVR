[package]
name = "link_spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone crate: not a member of the ALVR workspace.
[workspace]

[dependencies]
# Same openxrs fork and rev as alvr/client_openxr. No loader feature: "linked"/"static" do not
# compile on edition 2024 at this rev and "loaded" needs openxr_loader.dll, so runtime.rs loads
# the runtime DLL named by the runtime JSON itself (honours XR_RUNTIME_JSON, skips API layers).
openxr = { git = "https://github.com/zmerp/openxrs", rev = "e7c1b155e79ff8b58c2f6558d28e1398ebe08d2d", default-features = false }
libloading = "0.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_Registry",
] }
