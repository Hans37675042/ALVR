[project]
name = "roomd"
version = "0.1.0"
description = "realkk room service: ALVR depth/scene relay viewer (9944) and plugin server (9945)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "lz4>=4.3",
    "warp-lang==1.18.0",
]

[project.optional-dependencies]
synth = ["open3d==0.20.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
